name: Release

# Two stages, one workflow, on every push to main:
#
#   1. Version: while changesets are pending, changesets/action opens/updates
#      a "Version Packages" PR that bumps npm/package.json and writes
#      npm/CHANGELOG.md (see .changeset/README.md). Nothing is tagged or
#      published yet.
#
#   2. Release: once that PR merges (no changesets left), this job tags the
#      release, runs goreleaser (cross-platform binaries + GitHub release),
#      and publishes the npm wrapper, all in this run. A tag pushed by a
#      workflow's own GITHUB_TOKEN doesn't trigger another workflow, so the
#      release runs here instead of behind a `push: tags` trigger. It no-ops
#      if npm/package.json's version is already tagged, so ordinary pushes to
#      main (docs-only merges, etc.) are harmless.
#
# npm publish uses OIDC trusted publishing (provenance); no NPM_TOKEN needed.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm OIDC trusted publishing

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Version Packages PR
        id: changesets
        uses: changesets/action@v1
        with:
          version: npm run version-packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for unreleased version
        id: check
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: |
          VERSION=$(node -p "require('./npm/package.json').version")
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION already tagged, nothing to release"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-go@v5
        if: steps.check.outputs.should_release == 'true'
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run tests
        if: steps.check.outputs.should_release == 'true'
        run: go test ./...

      - name: Tag release
        if: steps.check.outputs.should_release == 'true'
        run: |
          git tag "v${{ steps.check.outputs.version }}"
          git push origin "v${{ steps.check.outputs.version }}"

      - uses: goreleaser/goreleaser-action@v6
        if: steps.check.outputs.should_release == 'true'
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish npm package
        if: steps.check.outputs.should_release == 'true'
        working-directory: npm
        run: npm publish --access public --provenance
