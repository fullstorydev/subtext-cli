views:
  - name: Dashboard
    route: /dashboard
    components:
      - name: DashboardCard
        selector: .dashboard-card
        source: dashboard
        properties:
          - { name: title, extract: { from: dom.attr, path: data-title } }
      - name: DashboardHeader
        selector: .dashboard-header
        source: dashboard

memory:
  - dashboard is the landing page after login
